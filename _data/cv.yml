summary: |
  Data science and ML leader who builds the system and the organization around it. Most recently at Stitch Fix as Data Science Manager, Architect and Director, leading the algorithms teams for merchandising, inventory, logistics and the product catalog while serving as their hands-on architect: recommender governance, LLM-based product data, embeddings and inventory optimization, with products driving $38M/yr and $50M+/yr in incremental revenue. Trained in computational cognitive science (MS, PhD ABD) and electrical engineering (MEng).
skills: "Python · SQL · PyTorch · recommender systems · embeddings and vector search · LLM applications (prompting, evaluation, agents) · causal inference and experimentation · simulation and optimization · MLOps and observability"
experience:
  - company: Stitch Fix
    website: https://algorithms-tour.stitchfix.com
    location: Remote
    role: "Data Science Manager · Data Science Architect · Data Science Director<br>Digital Supply Networks"
    dates: 2021-2026
    description: |
      Led data science and algorithms for merchandising, inventory, logistics and the product catalog: three teams through managers, with budget and headcount ownership; led cross-functional groups of engineers, data scientists and PMs within a 7-pod product-engineering org. Also the org's hands-on architect for decision systems and product data. Work discussed at [SXSW](https://schedule.sxsw.com/2024/events/PP141209), [NRF](https://nrf.com/blog/how-stitch-fix-macys-kraft-heinz-and-ocado-use-ai-keep-eye-supply-chain), [Vogue Business](https://www.voguebusiness.com/story/events/how-stitch-fix-is-using-ai-to-predict-trends) and [Stitch Fix earnings calls](https://investors.stitchfix.com/events/event-details/q3-fy24-stitch-fix-earnings-conference-call).
    milestones:
      - "**Decision architecture**: Co-founded a cross-functional algorithms steering committee (data science, finance, product, merchandising) and authored the decision architecture that replaced ad-hoc tuning of personalization and surfacing systems with one finance-approved objective balancing active clients, revenue and margin. Led rebuild of the production recommender to diagnose a run of failed tests, redesigned its testing (multi-cell, non-inferiority), and chose a new training target through simulation. Launched in 2026; early experiment results showed +2% revenue and +4% margin across all of Stitch Fix's channels."
      - "**LLM product attribution**: Championed and shipped LLM-based attribution for the product catalog: 100% of new styles attributed automatically at ~95% accuracy, with confidence scores routing uncertain items to human review."
      - "**Product embeddings**: Originated a shared, versioned image-and-product embedding layer to replace a legacy image model, with modular ETL (a model swap is a config change) and offline backtesting, serving search, similar items and recommendations. Authored the cross-org data contract for product data and embeddings: ownership of generation, evaluation, versioning, drift monitoring and backfills, plus provenance and freshness tiers."
      - "**AI Buying Tool**: Built a buying recommendation platform that uses client personalization to inform purchase orders. It informs 80%+ of orders for known SKUs and drives $38M/yr in incremental revenue, improving unit turn and GMROI. Consolidated dozens of merchandising tools into one platform."
      - "**Future inventory**: Rebuilt inventory and order management so returns in transit can be sold before they arrive, growing from $24M/yr to a $50M+/yr capability across exchanges, direct purchase and fix previews."
      - "**Inventory for first-time clients**: Rebuilt inventory availability into a client-aware reservation platform and used it to hold scarce inventory for first orders. In the first experiment, 2.5% more first-time clients were still active six months later. Rolled out to all first-time clients in 2026."
      - "**New-inventory performance**: Replaced sell-through debates with an exposure guarantee for new styles. Shipped a per-style scorecard and automated lifecycle actions (markdown, exit, size mapping)."
      - "**Inventory composition**: As the hands-on architect, developed the inventory composition model, showing how shelf age and inventory mix drive keep rate, and used it to balance sell-through of aged inventory against personalization. Aged inventory fell from a 62% peak to 22% while markdowns and liquidation fell and gross margin *increased*."
      - "**Standards and operating model**: Authored org-wide ML deployment standards (business-metric monitoring, defined failure modes, latency and shadow tests in CI, staging/production parity) and set the org's AI operating model (agent-first tooling, quarterly AI weeks). Retired dozens of legacy buying and liquidation tools so a smaller team delivered more."
